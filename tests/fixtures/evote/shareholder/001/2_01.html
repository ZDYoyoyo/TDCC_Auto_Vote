<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<title>FIXTURE 確認頁</title></head><body>
<table class="o-table c-votelist_userInfo"><tr><th>戶名：</th><td>測試用</td></tr></table>
<table class="o-table--card c-cardTable">
  <tr><th>１： 討論事項</th></tr>
  <tr><td>１： 測試議案內容</td><td>贊成</td></tr>
</table>
<textarea id="g-recaptcha-response-100000" name="g-recaptcha-response" style="display:none"></textarea>
<button name="button" onclick="voteObj.checkMeetingPartner(); return false;">確認投票結果</button>
<button name="button2" onclick="modifyVote(); return false;">修改投票結果</button>
<button name="button" onclick="showConfirmDialog('...',giveUpVote); return false;">取消投票</button>
<script>
// 測試可設 window.__FAIL_BOT = true，模擬真站的隱形機器人驗證判定失敗：
// 跳出 alert、停在原頁不前進（使用者 2026-09-30 實際遇過的訊息）。
// 也可設 window.__FAIL_BOT_DOM = true：改成在頁面上顯示文字（不跳 alert），
// 因為不確定真站是用哪一種方式顯示。
var voteObj = { checkMeetingPartner: function(){
  if (window.__FAIL_BOT) { alert('機器人驗證失敗'); return; }
  if (window.__FAIL_BOT_DOM) {
    document.body.insertAdjacentHTML('beforeend', '<div class="err">機器人驗證失敗</div>');
    return;
  }
  location.href = '6_01.html';
}};
function modifyVote(){ document.title = 'FIXTURE 災難:程式按到修改'; }
function giveUpVote(){ document.title = 'FIXTURE 災難:程式按到取消投票'; }
function showConfirmDialog(m,f){ f(); }
</script>
</body></html>
